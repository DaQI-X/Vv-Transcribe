name: Build

# 跨平台构建验证 CI
# - Windows x64：唯一无法在 macOS 本地构建的平台，由 CI 免费提供（ASR .exe + NSIS 安装包）
# - macOS arm64：原生回归验证
# - macOS x64：在 arm64 runner 上经 Rosetta + universal2 Python 构建（GitHub 已退役 Intel runner）
# 镜像选 macos-15：macos-14 已被 GitHub 标 deprecated（actions/runner-images#13518），
# 2026-10-28 两个 macos-14 job 排队 15 分钟零步骤被取消（runner 拿不到），Windows 同期绿。
# afterPack 会校验 ASR 二进制架构，架构不匹配时构建直接失败（防止 error -86 / EBADARCH）。

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    tags: ['v*']

# 默认只读：build job 不需要写仓库，能写的 GITHUB_TOKEN 会出现在每个步骤的环境里。
# release job 在自己的 job 上单独提 contents: write，只有发布那一步能写。
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 测试闸门：纯函数单测 + 全量类型检查，ubuntu 上跑，装完依赖十几秒出结果。
  # 用 needs 卡在三平台矩阵前面是为了「红在便宜的地方」：build job 每个都要装两份 Python venv、
  # 下 Electron 与 yt-dlp，一个类型错误不该烧那三份时间。
  # 装依赖的命令与 build job 保持一致（不加 --ignore-scripts、不设跳过二进制的环境变量）：
  # electron@44 的 install.js 根本没有 SKIP_BINARY 这类开关（本机 grep 过），
  # 而这类「省时间的变体」一旦在 CI 上炸，报错会和被测代码毫无关系，反而更难查。
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # 四个 project（app / node / electron / test）一起过：测试自己也在类型检查范围内，
      # 否则闸门会慢慢退化成一堆「跑得通但签名早改了」的用例。
      - name: Type check
        run: pnpm exec tsc -b --force

      - name: Unit tests
        run: pnpm test

  build:
    name: ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # 统一用 bash，避免 Windows pwsh 对相对可执行路径（venv/Scripts/python.exe）的解析问题
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            arch: x64
            electronArgs: --win --x64
            needsRosetta: false
            venvCreate: python -m venv python-asr/venv
            py: python-asr/venv/Scripts/python.exe
            artifactPath: dist/*.exe
            artifactName: Vv-Transcribe-Windows-x64
            ttsVenvCreate: python -m venv python-tts/venv
            ttsPy: python-tts/venv/Scripts/python.exe
            ttsArtifactPath: python-tts/dist-x64/vv-tts-server.exe
            ttsArtifactName: vv-tts-server-windows-x64
          - label: macOS arm64
            os: macos-15
            arch: arm64
            electronArgs: --mac --arm64
            needsRosetta: false
            venvCreate: python -m venv python-asr/venv
            py: python-asr/venv/bin/python
            artifactPath: dist/*.dmg
            artifactName: Vv-Transcribe-macOS-arm64
            ttsVenvCreate: python -m venv python-tts/venv
            ttsPy: python-tts/venv/bin/python
            ttsArtifactPath: python-tts/dist-arm64/vv-tts-server
            ttsArtifactName: vv-tts-server-macos-arm64
          - label: macOS x64 (Rosetta)
            os: macos-15
            arch: x64
            electronArgs: --mac --x64
            needsRosetta: true
            # universal2 Python 默认以 arm64 运行，所有 venv-x64 调用都必须经 arch -x86_64 强制 x64
            venvCreate: arch -x86_64 python -m venv python-asr/venv-x64
            py: arch -x86_64 python-asr/venv-x64/bin/python
            artifactPath: dist/*.dmg
            artifactName: Vv-Transcribe-macOS-x64
            ttsVenvCreate: arch -x86_64 python -m venv python-tts/venv-x64
            ttsPy: arch -x86_64 python-tts/venv-x64/bin/python
            ttsArtifactPath: python-tts/dist-x64/vv-tts-server
            ttsArtifactName: vv-tts-server-macos-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python (universal2 on macOS)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # yt-dlp-manifest.json 是构建期（fetch-yt-dlp）与运行期（应用内更新）共用的唯一信任来源。
      # 格式不对、或指纹与上游 SHA2-256SUMS/Release API 对不上，就在这一步红掉，
      # 不用等「Fetch bundled yt-dlp」——那时三个平台都已装完 Python 与依赖了。
      # 走官方域名而不是 YTDLP_MIRROR：这一步的职责就是核对官方产物，镜像同时给资产和 sums 时自证不了清白。
      - name: Verify yt-dlp manifest
        # 带 jobs token 是为了躲开 api.github.com 的「每 IP 每小时 60 次」：
        # runner 出口 IP 是共享的，2026-10-26 的 macOS x64 就是被这个 403 红掉的（另两平台同一步绿）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/yt-dlp-manifest.mjs

      # 本地配音组件的清单（#234）与 Release 资产对账：清单声明的 sha256 必须等于 GitHub 上传时自己算的 digest。
      # 清单文件还没进仓库时脚本只打一行说明再退出 0——那是「这条链路还没对外」的正常状态，
      # 但文件一旦进来，下面任何一条对不上就是拒绝构建的理由（清单是应用内按需下载的唯一信任来源）。
      - name: Verify components manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/components-manifest.mjs

      - name: Install Rosetta (macOS x64 only)
        if: matrix.needsRosetta
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Python venv
        run: ${{ matrix.venvCreate }}

      - name: Install Python dependencies
        run: |
          ${{ matrix.py }} -m pip install --upgrade pip
          ${{ matrix.py }} -m pip install -r python-asr/requirements.txt

      - name: Build ASR binary (${{ matrix.arch }})
        run: node scripts/build-asr.mjs --arch=${{ matrix.arch }}

      # 本地配音 sidecar。放在 Electron 打包前面：sherpa-onnx 的 wheel 矩阵或 PyInstaller 收原生库
      # 这几件事一旦在某个平台挂了，没必要再等两分钟的 pnpm build + electron-builder。
      # 产物只当 workflow artifact 存着，不进安装包——模型与引擎二进制走 #234 的 components Release
      # + 自家清单按需下载，安装包体积因此不受这项功能影响。
      - name: Create TTS Python venv
        run: ${{ matrix.ttsVenvCreate }}

      - name: Install TTS Python dependencies
        run: |
          ${{ matrix.ttsPy }} -m pip install --upgrade pip
          ${{ matrix.ttsPy }} -m pip install -r python-tts/requirements.txt

      - name: Build TTS binary (${{ matrix.arch }})
        run: node scripts/build-tts.mjs --arch=${{ matrix.arch }}

      - name: Upload TTS binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ttsArtifactName }}
          path: ${{ matrix.ttsArtifactPath }}
          if-no-files-found: error

      # 引擎冻结产物冒烟（#235 路径 A）：产物一出来就当场验，挂在已有矩阵里，不另开一次 CI。
      # 证的三件事都是「只有在这台机器上才看得出来」的：onefile 能不能解包拉起、
      # 身份握手回不回本次的 boot_id、sherpa-onnx 的原生库（Windows 的 onnxruntime.dll /
      # macOS 的 libonnxruntime）被 PyInstaller 收完之后还在不在——
      # 判据是「空模型目录要出 503（缺文件）而不是 500（import 挂）」，
      # 因为 sidecar 的 load_engine() 是先 import sherpa_onnx 再查文件。
      # 不下模型：135MB/426MB 那两份留给手测（路径 B），所以「出声」档在这里恒为跳过；
      # ASR 档也只到握手（faster_whisper 是懒加载），别把这条绿读成「转写/配音真跑过一遍」。
      # 架构用 matrix.arch 而不是 process.arch：macOS x64 job 的 Node 本身仍是 arm64，
      # 只有构建步骤被 arch -x86_64 按在 x64 里；那里的 x64 产物靠 Rosetta 拉起，
      # 所以它证的是「x64 这套库能跑」，RTF 不等于 Intel Mac。
      - name: Smoke engine binaries (${{ matrix.arch }})
        env:
          VV_ENGINE_SMOKE: '1'
          VV_ENGINE_SMOKE_ARCH: ${{ matrix.arch }}
        run: pnpm vitest run tests/engineSmoke.test.ts

      - name: Build renderer + main
        run: pnpm build

      # 链接转写用的 yt-dlp 独立二进制：不进仓库，构建时按平台拉官方包并校验 SHA2-256。
      # afterPack 会检查它是否真的进了包，缺了就红。
      - name: Fetch bundled yt-dlp
        run: node scripts/fetch-yt-dlp.mjs --arch=${{ matrix.arch }}

      - name: Package Electron app
        run: pnpm exec electron-builder ${{ matrix.electronArgs }} --config electron-builder.cjs --publish never
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error

  # 仅当推送 v* tag 时触发：汇总三平台产物发布到 GitHub Release，产出面向用户的永久下载直链。
  # main 守卫：tag 指向的 commit 必须是 main 的祖先，否则拒绝发布——保证只有 main 的稳定版本能对外。
  # 版本守卫：package.json 的 version 必须等于 tag 名，否则拒绝发布——v1.0.2 就是漏了 bump，发出去的安装包自报 1.0.1。
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" FETCH_HEAD; then
            echo "::error::tag ${{ github.ref_name }} 不在 main 分支上，拒绝发布 Release（发布版本必须来自 main）"
            exit 1
          fi
          echo "tag ${{ github.ref_name }} 已在 main 上，允许发布 Release"

      # 版本号来源只有 package.json（electron-builder.cjs 没有 extraMetadata.version 覆盖），
      # 所以 tag 名和它不一致就意味着发布出去的应用自报另一个版本，检查更新会永久误报。
      - name: Verify package.json version matches tag
        run: |
          pkg_version=$(sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([^"]*)",?[[:space:]]*$/\1/p' package.json | head -1)
          expected="${GITHUB_REF_NAME#v}"
          if [ -z "${pkg_version}" ]; then
            echo "::error::没能从 package.json 读出 version 字段"
            exit 1
          fi
          if [ "${pkg_version}" != "${expected}" ]; then
            echo "::error::package.json 版本 ${pkg_version} 与 tag ${GITHUB_REF_NAME} 不一致，拒绝发布。先提交「chore: 版本号升到 ${expected}」再打 tag"
            exit 1
          fi
          echo "package.json ${pkg_version} == tag ${GITHUB_REF_NAME}，版本一致"

      - name: Setup Node
        # 打包脚本只用 node 内置模块，所以这里不 pnpm install（理由与 publish-components 那条一样：
        # 少一条能挂的依赖，也省两分钟）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # tag 注解全文就是给人读的发布说明。这里必须用 %(contents)，不能用 %(contents:body)：
      # 后者会跳过注解首行，而首行是那句版本摘要（v1.0.5 的 Release 就是这么丢了导语的）。
      # 轻量标签没有注解对象，此时导出空文件，发布说明只剩自动生成的 changelog。
      - name: Export tag annotation as release notes
        run: |
          git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}" 2>/dev/null)" = tag ]; then
            git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > release-notes.md
          else
            : > release-notes.md
            echo "::warning::取不到 ${GITHUB_REF_NAME} 的 tag 注解（轻量标签或拉取失败），发布说明只用自动生成的 changelog"
          fi
          echo "release-notes.md $(wc -c < release-notes.md) bytes:"
          cat release-notes.md

      # ── 本地配音组件随本版一起发布（#234）────────────────────────────────────────
      # 为什么挪进创建过程：仓库 2026-10-26 开了 Release immutability，已发布的 Release 事后
      # 一个资产都加不进去（publish-components.yml 就死在这上面，HTTP 422）。唯一合法的位置是
      # 「创建 Release 时一起传」，而那只有本 job 做得到。附带的好处是真的：这三份二进制与三个
      # 安装包出自同一次构建，不再需要人工指名 run-id，清单指纹对应的必然是眼前这一次产物。
      #
      # 代价也要认：这几步一旦红，本版 Release 就发不出去（因为跳过去发布就等于永久传不上去）。
      # 这是两害相权里选中的那一个——宁可当晚补一步再发，也不要发一个「引擎永远没下载包」的版本。
      - name: Arrange component staging
        run: |
          set -euo pipefail
          mkdir -p staging/darwin-arm64 staging/darwin-x64 staging/win32-x64
          # workflow 产物名（macos-arm64）与清单里的平台键（darwin-arm64）是两套命名，在这儿翻译一次。
          # 用 find 而不是写死相对路径：upload-artifact 存的层级取决于当时的 path 写法，
          # 「产物目录里就一个二进制」时靠 find 取比猜结构稳。
          for pair in "vv-tts-server-macos-arm64:darwin-arm64:vv-tts-server" "vv-tts-server-macos-x64:darwin-x64:vv-tts-server" "vv-tts-server-windows-x64:win32-x64:vv-tts-server.exe"; do
            src="${pair%%:*}"; rest="${pair#*:}"; key="${rest%%:*}"; bin="${rest#*:}"
            stem="${bin%.exe}"
            # `| head -1` 在 pipefail 下会因为对端提前关闭而把 find 记成失败，所以补 || true
            found=$(find "artifacts/$src" -type f -name "${stem}*" | head -1 || true)
            if [ -z "$found" ]; then
              echo "::error::产物 $src 里找不到 $bin——这个平台的引擎二进制没构建出来，宁可不发这一版，也不要发一份缺平台的清单（那等于把那个平台的用户挡在按需下载外面）"
              exit 1
            fi
            mv "$found" "staging/$key/$bin"
            echo "staging/$key/$bin  $(stat -c %s "staging/$key/$bin") bytes"
          done

      - name: Pack component assets and generate manifest
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          node scripts/components-manifest.mjs --build \
            --staging=staging --out=dist-components --version="$version" --tag="$GITHUB_REF_NAME"
          # 清单要人工看过 diff 才提交进 main（应用读的是 main 上那份），所以把全文抄进 job summary：
          # 原始日志匿名是 403，summary 与公开资产才是「谁都能复核」的那两份副本。
          {
            echo "### 本版生成的组件清单（人工核对后再提交进 main）"
            echo '```json'
            cat components-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l dist-components/

      # 七个要挂的文件在这儿收齐（3 安装包 + 3 份引擎资产 + 1 份清单），发布步骤只认 publish/*。
      # 为什么不用 artifacts/**/*.dmg 那种通配：① 它正是 v1.0.6 多出那枚 vv-tts-server.exe 的原因
      # （**/*.exe 把 Windows 引擎二进制也当安装包挂了上去，白多一枚 24MB 公开资产，还绕过清单）；
      # ② 单层 * 依赖 upload-artifact 内部到底保不保留 dist/ 这一层，而这一步挂了就是整版发不出去，
      # 不该把发布押在 glob 语义上。find + 显式复制把这件事变成能看懂的错误。
      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p publish
          for pair in "Vv-Transcribe-macOS-arm64:dmg" "Vv-Transcribe-macOS-x64:dmg" "Vv-Transcribe-Windows-x64:exe"; do
            src="${pair%%:*}"; ext="${pair#*:}"
            found=$(find "artifacts/$src" -type f -name "*.${ext}" | head -1 || true)
            if [ -z "$found" ]; then
              echo "::error::产物 $src 里没找到 .$ext 安装包——三个安装包少一个都不该发（下载直链与官网按钮都指向它）"
              exit 1
            fi
            cp "$found" "publish/"
          done
          cp dist-components/* publish/
          cp components-manifest.json publish/
          n=$(ls publish | wc -l)
          if [ "$n" -ne 7 ]; then
            echo "::error::publish/ 里是 $n 个文件，应为 7（3 安装包 + 3 份引擎资产 + 1 份清单）——Release 一旦发出去就不可变，多挂少挂都补不回来，所以在这儿拦住"
            ls -l publish/
            exit 1
          fi
          echo "publish/ 里要挂的 $n 个文件："
          ls -l publish/

      - name: Publish to GitHub Release
        # 钉 SHA 而不是 @v2：这一步跑在 release job 里，环境变量里有能写 GitHub Release 的
        # GITHUB_TOKEN。tag 是可移动的，上游一旦 force-move 或发了被投毒的版本，我们一行代码
        # 没改就会跑到它身上。3bb1273 = v2 系列当前指向的提交（release 2.6.2，2026-04-12）。
        # 升级流程：核对官方 release 页面与源码后，改这里并保证注释里的版本号一起更新。
        #
        # ⚠ 每个版本只允许这一步成功一次。Release 一旦创建就是不可变的（仓库设置，2026-10-26），
        # 再跑一次「Re-run jobs」会在资产上传处 422——那不是新 bug，别去修 gh 或换 action。
        # 资产没传全又要重发，只有两个办法：挪版本号重打 tag，或临时关掉 immutability。
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: publish/*
          body_path: release-notes.md
          # 与 body_path 并存时，action 会把自动生成的 changelog 追加在正文之后
          generate_release_notes: true
          fail_on_unmatched_files: true

      # 对账放在发布之后：这一步比的是 GitHub 上传时自己算出来的 digest，跨得过「资产在路上被换过」
      # 那一类问题，而我们本机算的 sha256 只能自证。它同时也是「人工核对清单」的凭据——
      # 绿了就说明 main 上即将提交的那份与 Release 上真实存在的资产逐条对得上。
      # 紧跟在创建后面，state/digest 有可能还没被 GitHub 填完：脚本为此最多看 6 轮、每轮等 20 秒，
      # 6 轮后仍未落定就判红。这条是 2026-10-29 补的——旧写法对 digest 缺席只 warn 一句就放绿，
      # 那等于「什么都没核对的绿色」，而这一步存在的唯一理由就是核对。
      # 失败原因必须落进 ::error:: 注解：原始日志匿名 403，只有注解公开可读（理由见 publish-components 那步）。
      - name: Verify the manifest against the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! node scripts/components-manifest.mjs 2>/tmp/verify.err; then
            cat /tmp/verify.err
            echo "::error::清单与 ${GITHUB_REF_NAME} 上的资产对账失败：$(tr '\n' ' ' < /tmp/verify.err)"
            exit 1
          fi
          cat /tmp/verify.err || true

