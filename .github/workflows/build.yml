name: Build

# 跨平台构建验证 CI
# - Windows x64：唯一无法在 macOS 本地构建的平台，由 CI 免费提供（ASR .exe + NSIS 安装包）
# - macOS arm64：原生回归验证
# - macOS x64：在 arm64 runner 上经 Rosetta + universal2 Python 构建（GitHub 已退役 Intel runner）
# afterPack 会校验 ASR 二进制架构，架构不匹配时构建直接失败（防止 error -86 / EBADARCH）。

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    tags: ['v*']

# 默认只读：build job 不需要写仓库，能写的 GITHUB_TOKEN 会出现在每个步骤的环境里。
# release job 在自己的 job 上单独提 contents: write，只有发布那一步能写。
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # 统一用 bash，避免 Windows pwsh 对相对可执行路径（venv/Scripts/python.exe）的解析问题
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            arch: x64
            electronArgs: --win --x64
            needsRosetta: false
            venvCreate: python -m venv python-asr/venv
            py: python-asr/venv/Scripts/python.exe
            artifactPath: dist/*.exe
            artifactName: Vv-Transcribe-Windows-x64
          - label: macOS arm64
            os: macos-14
            arch: arm64
            electronArgs: --mac --arm64
            needsRosetta: false
            venvCreate: python -m venv python-asr/venv
            py: python-asr/venv/bin/python
            artifactPath: dist/*.dmg
            artifactName: Vv-Transcribe-macOS-arm64
          - label: macOS x64 (Rosetta)
            os: macos-14
            arch: x64
            electronArgs: --mac --x64
            needsRosetta: true
            # universal2 Python 默认以 arm64 运行，所有 venv-x64 调用都必须经 arch -x86_64 强制 x64
            venvCreate: arch -x86_64 python -m venv python-asr/venv-x64
            py: arch -x86_64 python-asr/venv-x64/bin/python
            artifactPath: dist/*.dmg
            artifactName: Vv-Transcribe-macOS-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python (universal2 on macOS)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rosetta (macOS x64 only)
        if: matrix.needsRosetta
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Python venv
        run: ${{ matrix.venvCreate }}

      - name: Install Python dependencies
        run: |
          ${{ matrix.py }} -m pip install --upgrade pip
          ${{ matrix.py }} -m pip install -r python-asr/requirements.txt

      - name: Build ASR binary (${{ matrix.arch }})
        run: node scripts/build-asr.mjs --arch=${{ matrix.arch }}

      - name: Build renderer + main
        run: pnpm build

      # 链接转写用的 yt-dlp 独立二进制：不进仓库，构建时按平台拉官方包并校验 SHA2-256。
      # afterPack 会检查它是否真的进了包，缺了就红。
      - name: Fetch bundled yt-dlp
        run: node scripts/fetch-yt-dlp.mjs --arch=${{ matrix.arch }}

      - name: Package Electron app
        run: pnpm exec electron-builder ${{ matrix.electronArgs }} --config electron-builder.cjs --publish never
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error

  # 仅当推送 v* tag 时触发：汇总三平台产物发布到 GitHub Release，产出面向用户的永久下载直链。
  # main 守卫：tag 指向的 commit 必须是 main 的祖先，否则拒绝发布——保证只有 main 的稳定版本能对外。
  # 版本守卫：package.json 的 version 必须等于 tag 名，否则拒绝发布——v1.0.2 就是漏了 bump，发出去的安装包自报 1.0.1。
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" FETCH_HEAD; then
            echo "::error::tag ${{ github.ref_name }} 不在 main 分支上，拒绝发布 Release（发布版本必须来自 main）"
            exit 1
          fi
          echo "tag ${{ github.ref_name }} 已在 main 上，允许发布 Release"

      # 版本号来源只有 package.json（electron-builder.cjs 没有 extraMetadata.version 覆盖），
      # 所以 tag 名和它不一致就意味着发布出去的应用自报另一个版本，检查更新会永久误报。
      - name: Verify package.json version matches tag
        run: |
          pkg_version=$(sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([^"]*)",?[[:space:]]*$/\1/p' package.json | head -1)
          expected="${GITHUB_REF_NAME#v}"
          if [ -z "${pkg_version}" ]; then
            echo "::error::没能从 package.json 读出 version 字段"
            exit 1
          fi
          if [ "${pkg_version}" != "${expected}" ]; then
            echo "::error::package.json 版本 ${pkg_version} 与 tag ${GITHUB_REF_NAME} 不一致，拒绝发布。先提交「chore: 版本号升到 ${expected}」再打 tag"
            exit 1
          fi
          echo "package.json ${pkg_version} == tag ${GITHUB_REF_NAME}，版本一致"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # tag 注解正文（首行标题之后的部分）就是给人读的发布说明。
      # 轻量标签没有注解对象，此时导出空文件，发布说明只剩自动生成的 changelog。
      - name: Export tag annotation as release notes
        run: |
          git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}" 2>/dev/null)" = tag ]; then
            git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents:body)' > release-notes.md
          else
            : > release-notes.md
            echo "::warning::取不到 ${GITHUB_REF_NAME} 的 tag 注解（轻量标签或拉取失败），发布说明只用自动生成的 changelog"
          fi
          echo "release-notes.md $(wc -c < release-notes.md) bytes:"
          cat release-notes.md

      - name: Publish to GitHub Release
        # 钉 SHA 而不是 @v2：这一步跑在 release job 里，环境变量里有能写 GitHub Release 的
        # GITHUB_TOKEN。tag 是可移动的，上游一旦 force-move 或发了被投毒的版本，我们一行代码
        # 没改就会跑到它身上。3bb1273 = v2 系列当前指向的提交（release 2.6.2，2026-04-12）。
        # 升级流程：核对官方 release 页面与源码后，改这里并保证注释里的版本号一起更新。
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
          body_path: release-notes.md
          # 与 body_path 并存时，action 会把自动生成的 changelog 追加在正文之后
          generate_release_notes: true
          fail_on_unmatched_files: true

