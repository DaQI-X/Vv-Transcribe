name: Publish components

# 本地配音组件的发布流程（#234）：把 CI 构建出来的引擎二进制传到某个 Release 上，并产出 components-manifest.json。
#
# ⚠ 本流程已被 build.yml 的 release job 取代（2026-10-29）。仓库 2026-10-26 开了 Release immutability，
#   已发布的 Release 一个资产都加不进去——本流程跑到 Upload 那步必然 HTTP 422（v1.0.6 就是这么停住的，
#   run 40721273648）。资产现在只能在「创建 Release」时一起传，而那只有 build.yml 做得到。
#   这份文件留着只作为一种回收路径：真要往历史版本补资产，得先在 Settings → General → Releases
#   临时取消勾选 immutability，补完再勾回去；不改设置的话这里每一步都会红在同一句上。
#   2026-10-29 拍板：不删。补挂别的版本的资产只有这条路，删了连「怎么补」都没地方记。
#
# 同一次拍板里还有一条：tag 输入不给默认值（原来钉着 v1.0.6），改成一律手填。
#   理由不是「懒得填」，而是这条路只有一个能成立的场景——清单在 main 上只有一份，里面只有一个 tag 指针
#   （scripts 那边 version 又直接由 tag 推导），而应用把 entry.tag 拼进下载 URL。所以「补挂历史版本」
#   一旦把那份清单提交进 main，后来所有版本的用户都会被指到那次构建的二进制上；这条路只在
#   「当前这一版的 Release 创建时资产没传全」时才有意义，而那一刻该填哪一枚只有人知道。
#   写死的版本号每发一版就过期一次，所以这里不留任何版本号。
#
# 为什么是人工指名而不是自动跑：
# - 这些资产是「应用内按需下载」的信任来源，传错一次就会被用户机器长期缓存，版本号还得跟着清单走；
# - 引擎二进制只能来自某一次具体的构建（PyInstaller 不可交叉编译），所以必须人工指名 run-id。
#   「最近一次成功」那种隐式取法会让清单里的指纹对应到一次没人看过的构建上。
# - 2026-10-28 加过一条 tag 触发（components/vX.Y.Z.run.<run-id>），为的是「本机只有 SSH、无 gh 无 PAT
#   时也能触发」。它在 2026-10-29 摘掉了：资产链挪进 build.yml 的创建过程之后，这条路一步都走不通，
#   剩下的作用只有一个——谁推了这样一个 tag 就得到一枚 422 的红 X，把「这条路已经不作数」看成「发布坏了」。
#
# 为什么上传发生在 CI 而不是本地：
# - 三平台里 Windows x64 与 macOS x64 本来只有 CI 能产，开发机只有一份本机架构；
# - runner 上的 GITHUB_TOKEN 自带 contents: write（本 job 单独提权），不需要任何人把 token 交给谁。
#
# 清单不在这里直接合进 main：脚本把生成的 components-manifest.json 当 workflow artifact 交回人工，
# 看过 diff 再提交。这与 yt-dlp-manifest.json 的处理一致——清单是信任锚，改它必须有人签字；
# CI 无权把自己刚生成的信任锚直接推到 main 上（那样「CI 被改」和「清单被改」就塌成同一件事了）。
#
# 模型不在这个流程里：第三方权重（csukuangfj/sherpa-onnx-vits-zh-ll）的再分发许可尚未核实——
# 2026-10-28 实测该 HuggingFace 仓库的 license 字段为空、也没有 LICENSE 文件。
# 打包侧 scripts/components-manifest.mjs 已经支持 <staging>/models/<engine-id>/，
# 许可核实完只需要在这里加一步把目录准备好，不用改脚本。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要补挂资产到哪个 Release：填一枚已存在、且此刻缺着这套引擎包的 vX.Y.Z（形状在 Validate 那步卡死）。这里故意不给默认值——写死的版本号每发一版就过期一次，该填哪一枚只有点它的人知道。新版本正常不走这里：它的资产由 build.yml 在创建 Release 那一刻一起带上'
        required: true
      runId:
        description: 'TTS 引擎二进制来自哪一次 Build 工作流的 run-id'
        required: true

permissions:
  contents: read

concurrency:
  group: publish-components
  cancel-in-progress: false

jobs:
  publish:
    name: 打包并上传组件资产
    runs-on: ubuntu-latest
    # 只有这一步需要写：上传资产与读 Release 都用这个 jobs token
    permissions:
      contents: write
    # 表单给的是自由字符串，直接拼进 run 脚本就是脚本注入的入口。
    # 所以原始输入只在一处读（下面 Validate），形状卡死后归一成 TAG / RUN_ID 两个环境变量，
    # 之后的步骤只引用这两个变量，不再碰 inputs。
    env:
      DISPATCH_TAG: ${{ inputs.tag }}
      DISPATCH_RUN_ID: ${{ inputs.runId }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate trigger inputs
        run: |
          set -euo pipefail
          if ! printf '%s' "${DISPATCH_TAG:-}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag 要写成 vX.Y.Z（收到 ${DISPATCH_TAG:-}）"
            exit 1
          fi
          if ! printf '%s' "${DISPATCH_RUN_ID:-}" | grep -Eq '^[0-9]+$'; then
            echo "::error::run-id 只能是数字（收到 ${DISPATCH_RUN_ID:-}）"
            exit 1
          fi
          echo "TAG=${DISPATCH_TAG}" >> "$GITHUB_ENV"
          echo "RUN_ID=${DISPATCH_RUN_ID}" >> "$GITHUB_ENV"
          echo "输入形状合法：tag=${DISPATCH_TAG} run-id=${DISPATCH_RUN_ID}"

      # 打包脚本只用 node 内置模块，所以这里不 pnpm install：省掉两分钟，也少一条能挂的依赖
      - name: Check the release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 字段名是 isDraft 不是 draft：gh 先校验 --json 的字段名，写错整步 exit 1
          # （2026-10-28 这个流程第一次跑就挂在这上面，而挂的原因当时根本看不到）。
          # 所以失败原因要落进 ::error:: 注解——原始日志匿名是 403，但 job 页面的注解公开可读，
          # 只有写进注解，下一个只有 SSH 的人（也就是今晚的我们）才知道该修什么。
          if ! out=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,assets \
            --jq '"Release " + .tagName + " (draft=" + (.isDraft|tostring) + "), 现有资产 " + (.assets | length | tostring) + " 个"' 2>/tmp/gh.err); then
            echo "::error::gh release view ${TAG} 失败：$(tr '\n' ' ' < /tmp/gh.err)"
            exit 1
          fi
          echo "$out"

      - name: Download TTS binaries
        uses: actions/download-artifact@v4
        with:
          name: vv-tts-server-macos-arm64
          path: raw/macos-arm64
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download TTS binaries (macOS x64)
        uses: actions/download-artifact@v4
        with:
          name: vv-tts-server-macos-x64
          path: raw/macos-x64
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download TTS binaries (Windows x64)
        uses: actions/download-artifact@v4
        with:
          name: vv-tts-server-windows-x64
          path: raw/windows-x64
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # workflow 产物名与清单里的平台键是两套命名（macos-arm64 vs darwin-arm64），在这儿翻译一次。
      # 用 find 而不是写死相对路径：upload-artifact 里存的层级取决于当时的 path 写法，
      # 「产物目录里就一个二进制」时靠 find 取比猜结构稳。取不到就直接红——宁可不发，
      # 也不要发一份缺平台的清单出去（那等于把那个平台的用户挡在外面还不知道）。
      - name: Arrange staging
        run: |
          set -euo pipefail
          mkdir -p staging/darwin-arm64 staging/darwin-x64 staging/win32-x64
          for pair in "macos-arm64:darwin-arm64:vv-tts-server" "macos-x64:darwin-x64:vv-tts-server" "windows-x64:win32-x64:vv-tts-server.exe"; do
            src="${pair%%:*}"; rest="${pair#*:}"; key="${rest%%:*}"; bin="${rest#*:}"
            stem="${bin%.exe}"
            # `| head -1` 在 pipefail 下会因为对端提前关闭而把 find 记成失败，所以补 || true
            found=$(find "raw/$src" -type f -name "${stem}*" | head -1 || true)
            if [ -z "$found" ]; then
              echo "::error::产物 ${src} 里找不到 ${bin}（run-id ${RUN_ID} 那次构建真的产出过 TTS 二进制吗）"
              exit 1
            fi
            mv "$found" "staging/$key/$bin"
            echo "staging/$key/$bin  $(stat -c %s "staging/$key/$bin") bytes"
          done

      - name: Pack assets and generate manifest
        run: |
          set -euo pipefail
          version="${TAG#v}"
          node scripts/components-manifest.mjs --build \
            --staging=staging --out=dist-components --version="$version" --tag="$TAG"
          {
            echo '### 生成的清单（要人工核对后再提交进 main）'
            echo '```json'
            cat components-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --clobber：同一个 Release 重跑时先删同名资产。否则 gh 会因为「已存在」失败，
          # 而那正好发生在最需要重跑的场合（上一次传到一半断了）
          # 清单也一起挂上：它本来只作为 workflow artifact 交回，而匿名是取不到 artifact 的
          # （本机构建链只有 SSH、没有 token），对账与复核都需要一份公开可读的副本。
          # 应用读的还是 main 里那份文件——多一个资产不改变信任模型，只是让「谁来复核」都取得到。
          # 失败原因同样落进注解：原始日志匿名 403，只有注解是公开可读的（理由见上面 Check 那步）。
          if ! gh release upload "$TAG" dist-components/* components-manifest.json --clobber --repo "$GITHUB_REPOSITORY" 2>/tmp/upload.err; then
            echo "::error::gh release upload ${TAG} 失败：$(tr '\n' ' ' < /tmp/upload.err)"
            exit 1
          fi
          # 下面这行只是把资产列出来看一眼，字段名写错也不该把已经传成功的发布判成失败
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | .name + "  " + (.size|tostring) + "  " + (.state // "?")' || true

      # 这一步才是对账：GitHub 上传时自己算的 digest 与清单里的 sha256 必须逐条相同。
      # 放在上传之后是因为「我们本机算的指纹」只能自证，跨不过「资产在路上被换过」这一类问题。
      - name: Verify the manifest against the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/components-manifest.mjs

      - name: Publish the manifest for human review
        uses: actions/upload-artifact@v4
        with:
          name: components-manifest
          path: |
            components-manifest.json
            dist-components/
          if-no-files-found: error
          retention-days: 30
