name: Mirror Release

# 把 GitHub Release 的全部资产逐字节同步到下载镜像。GitHub Release 仍是唯一发版源：
# 镜像只是副本，不是第二条发布链路。两个后端，各自独立开关（secrets 没配就绿退）：
# - R2（dl.vvscribe.com，桶未建好前是空转）：rclone copy，幂等重跑只补缺。
# - Hugging Face 数据集（Seven7Q/vv-transcribe-releases）：按版本打 tag，
#   镜像链接钉 tag（.../resolve/v<ver>/<file>），国内走 hf-mirror.com 换域名。
#   同步的是 Release 原文件，不重新打包——重打字节必变，SHA256SUMS 就对不上。
#
# 两个入口：
# - workflow_call：build.yml 的 release job 成功后自动调用（tag 发版链路的一环）
# - workflow_dispatch：手工回填或重试（例如镜像上线前发布的 v1.2.1）
#
# 失败不影响已发布的 Release。
# 依赖仓库 secrets：R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY（R2）
# 与 HF_TOKEN（HF，fine-grained，只对该数据集有写权限，绝不进日志）。
# 没配时对应后端打警告后绿退（镜像是增益项，不该把发版链路拦死），配好后 dispatch 即可补上。

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tag:
        description: '要镜像的 Release tag（如 v1.2.1）'
        required: true
        type: string

permissions:
  contents: read

jobs:
  mirror:
    name: Sync assets to mirrors
    runs-on: ubuntu-latest
    # 首同步要往 HF 传 1.15GB（v1.2.1 七件资产），30 分钟留得紧，抬到 45
    timeout-minutes: 45
    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          # 只认三段 semver（与发版口径一致）；tag 会进 rclone 目标路径，先验再用
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag 必须是 v三段版本号（如 v1.2.1），收到的是：$tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # runner 在 GitHub 网内，拉 Release 资产不受国内带宽问题影响。
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" --dir release-assets --clobber
          ls -l release-assets

      # 镜像目录里必须有一份 SHA256SUMS.txt，用户才能校验「镜像副本 == 发版原件」。
      # 新版本的清单在 release job 里随 Release 一起上传（immutability，事后补不进去）；
      # 镜像上线前的旧版本（如 v1.2.1）Release 里没有，就按刚下载到的资产现算一份，只挂镜像。
      - name: Ensure SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd release-assets
          if [ -f SHA256SUMS.txt ]; then
            sha256sum -c SHA256SUMS.txt
          else
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
            echo "::notice::该 Release 没有随附清单（镜像上线前的旧版本），已按下载到的资产现算 SHA256SUMS.txt"
          fi
          cat SHA256SUMS.txt

      - name: Sync to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCOUNT_ID}" ] || [ -z "${RCLONE_CONFIG_R2_ACCESS_KEY_ID}" ] || [ -z "${RCLONE_CONFIG_R2_SECRET_ACCESS_KEY}" ]; then
            echo "::warning::R2 secrets 未配置（R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY），跳过镜像同步。GitHub Release 不受影响；配好后手工 dispatch 本 workflow 即可补上。"
            exit 0
          fi
          dest="r2:vv-transcribe-downloads/${{ steps.tag.outputs.tag }}"
          # --s3-no-check-bucket：桶已由控制台建好，令牌只有对象读写权限，别让 rclone 尝试建桶
          rclone copy release-assets "$dest" --s3-no-check-bucket --checksum --transfers 4 --s3-upload-concurrency 4 --retries 3
          # 传完再对一次体积：证「桶里的件数与大小 == 刚从 Release 下载的」。
          # 不用哈希比对——几百 MB 走 multipart，R2 的 ETag 不是 MD5，rclone check 默认比哈希会误报；
          # 真正的字节完整性由上传前那步 sha256sum 对账锚定（用户下载后也可拿 SHA256SUMS.txt 复核）。
          rclone check release-assets "$dest" --s3-no-check-bucket --size-only
          rclone ls "$dest" --s3-no-check-bucket

      # HF 数据集后端：产物按「当前 main 修订 = 最新发版」落根目录，再给该修订打 v<ver> tag。
      # 链接一律钉 tag（resolve/v<ver>/<file>），旧版本 tag 指向各自的历史修订，永不被后版覆盖。
      # 重跑幂等：内容没变时 upload_folder 不产生新提交，随后的逐件体积对账仍会跑。
      - name: Sync to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: Seven7Q/vv-transcribe-releases
          HF_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN}" ]; then
            echo "::warning::HF_TOKEN 未配置，跳过 HF 同步。GitHub Release 与 R2 不受影响；配好后手工 dispatch 本 workflow 即可补上。"
            exit 0
          fi
          # 钉版本：v1.2.2 那次红就是浮动依赖红——11-21 装的 hub 里 refs.tags 元素是 TagInfo(.tag)，
          # 11-22 pip 拉到 1.8.0 换成 GitRefInfo(.name)，那行集合推导抛 AttributeError。
          # 挂载在发版之后的镜像步骤不该被上游改名拦死，所以版本由这里决定，不由「今天 PyPI 上是谁」决定。
          # 升级流程：本地按同版本跑通 list_repo_refs/create_tag 后改这一行。
          python3 -m pip install -q huggingface_hub==1.8.0
          python3 - <<'PY'
          import os
          import sys

          from huggingface_hub import HfApi

          repo = os.environ["HF_REPO"]
          tag = os.environ["HF_TAG"]
          api = HfApi(token=os.environ["HF_TOKEN"])

          # phase 只服务于报错：原始日志匿名 404，只有 ::error:: 注解公开可读，
          # 所以「挂在哪一段」必须自己写进注解。异常原文只留类名 + 首行前 280 字，
          # 因为注解是公开的——绝不打印 token、请求头，或可能带凭据的完整 URL。
          phase = "初始化"
          try:
              # 公开性是前提：镜像链接给终端用户直连，私有仓传成功也没用，先拦住再说。
              phase = "repo_info（认证与可见性）"
              info = api.repo_info(repo_id=repo, repo_type="dataset")
              if info.private:
                  print(f"::error::数据集 {repo} 是私有，镜像必须是公开的")
                  sys.exit(1)

              # 重跑幂等：上一轮「传成功、打 tag 挂了」时（v1.2.2 就是这样），
              # 内容没变的 upload_folder 不产生新提交；没有这一句，重试等于白传 1.1GB。
              phase = "upload_folder（本版全部资产，约 1.1GB）"
              api.upload_folder(
                  repo_id=repo,
                  repo_type="dataset",
                  folder_path="release-assets",
                  commit_message=f"Sync GitHub Release {tag}",
              )

              # 体积对账：证「数据集当前修订里的每件 == 刚从 Release 下载的」。
              # 只比大小不比哈希——LFS 大文件全量回读要再花一倍时间，
              # 字节完整性由 SHA256SUMS.txt 锚定（用户下载后可自行复核）。
              phase = "体积对账"
              local = sorted(f for f in os.listdir("release-assets") if os.path.isfile(f"release-assets/{f}"))
              sizes = {i.path: i.size for i in api.get_paths_info(repo_id=repo, paths=local, repo_type="dataset")}
              bad = []
              for name in local:
                  expect = os.path.getsize(f"release-assets/{name}")
                  got = sizes.get(name)
                  mark = "ok" if got == expect else "MISMATCH"
                  if got != expect:
                      bad.append(name)
                  print(f"{mark}\t{name}\tlocal={expect}\tremote={got}")
              if bad:
                  print(f"::error::HF 上体积对不上的文件：{', '.join(bad)}")
                  sys.exit(1)

              # refs.branches / refs.tags 在 1.x 都是 GitRefInfo(name, ref, target_commit)。
              phase = "钉 tag"
              refs = api.list_repo_refs(repo_id=repo, repo_type="dataset")
              revision = next((b.target_commit for b in (refs.branches or []) if b.name == "main"), "main")
              tagged = {t.name: t.target_commit for t in (refs.tags or [])}
              if tagged.get(tag) == revision:
                  print(f"tag {tag} 已指向本轮修订 {revision[:12]}，不动")
              else:
                  # 同名 tag 指在别的修订上（上一轮传完就红、或同一版本号重发过）才重指。
                  # Release 不可变，所以「同一版本号两份内容」实际只会来自上一轮没打完，
                  # 删建之间那几秒的空窗不会把在线链接长期留断。
                  if tag in tagged:
                      api.delete_tag(repo_id=repo, repo_type="dataset", tag=tag)
                  api.create_tag(repo_id=repo, repo_type="dataset", tag=tag, revision=revision,
                                 tag_message=f"mirror of GitHub Release {tag}")
                  print(f"已打/重指 tag {tag} -> {revision[:12]}")
              print(f"树：https://huggingface.co/datasets/{repo}/tree/{tag}")
          except Exception as err:
              print(f"::error::HF 同步在「{phase}」失败：{type(err).__name__}: {str(err).splitlines()[0][:280]}")
              sys.exit(1)
          PY

      # tag 存在性独立成一步、只用匿名接口查（不带 token，所以这一步同时证了「公开读得到」）：
      # 上一版的教训是资产传上去了、tag 那行挂了，job 红得很笼统。镜像链接钉 tag
      # （.../resolve/<tag>/<file>），缺 tag 对用户等于「这一版没镜像」，而数据集里明明躺着 1.1GB。
      - name: Verify mirror tag is resolvable
        env:
          HF_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          refs=$(curl -fsSL --max-time 60 \
            "https://hf-mirror.com/api/datasets/Seven7Q/vv-transcribe-releases/refs")
          if ! printf '%s' "$refs" | grep -q "\"name\":\"${HF_TAG}\""; then
            echo "refs: $refs"
            echo "::error::${HF_TAG} 不在数据集 refs 里——资产可能已上传，但钉 tag 没成功：镜像链接对这一版全是 404"
            exit 1
          fi
          echo "hf-mirror 的 refs 里有 ${HF_TAG}"